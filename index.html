<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #FFF5F2 0%, #FFEBE5 50%, #FFD6CB 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px 0 rgba(255, 107, 0, 0.08);
        }
        .orange-btn {
            background: linear-gradient(135deg, #FF6B00 0%, #FF8800 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">
    <div class="max-w-xl w-full glass-card rounded-3xl p-6 md:p-8 space-y-6">
        
        <!-- Header & Toggles -->
        <div class="flex flex-col gap-4 border-b border-orange-100 pb-5">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-900">AI Agent Control Panel</h1>
                <span id="connection_badge" class="text-xs font-semibold px-3 py-1 rounded-full bg-gray-200 text-gray-700">Loading...</span>
            </div>

            <!-- Toggles Section -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <!-- Messenger Bot Toggle -->
                <div class="flex items-center justify-between bg-white/60 p-3 rounded-2xl border border-white">
                    <span class="text-xs font-semibold text-gray-700">Inbox AI Bot</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle_bot" onchange="toggleBot(this.checked)" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-500"></div>
                    </label>
                </div>

                <!-- Comment Reply Toggle -->
                <div class="flex items-center justify-between bg-white/60 p-3 rounded-2xl border border-white">
                    <span class="text-xs font-semibold text-gray-700">Comment AI Bot</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle_comment" onchange="toggleComment(this.checked)" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-500"></div>
                    </label>
                </div>
            </div>
        </div>

        <!-- Configuration Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Facebook Page Access Token</label>
                <input type="text" id="page_access_token" placeholder="EAA..." class="w-full px-4 py-3 rounded-2xl bg-white/70 border border-white/80 focus:outline-none focus:ring-2 focus:ring-orange-500/50 text-gray-800 text-sm shadow-inner">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Comment Access Token (Optional)</label>
                <input type="text" id="comment_access_token" placeholder="EAA... (Same as page token if empty)" class="w-full px-4 py-3 rounded-2xl bg-white/70 border border-white/80 focus:outline-none focus:ring-2 focus:ring-orange-500/50 text-gray-800 text-sm shadow-inner">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Groq API Key</label>
                <input type="password" id="groq_api_key" placeholder="gsk_..." class="w-full px-4 py-3 rounded-2xl bg-white/70 border border-white/80 focus:outline-none focus:ring-2 focus:ring-orange-500/50 text-gray-800 text-sm shadow-inner">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">AI System Prompt Instructions</label>
                <textarea id="custom_prompt" rows="4" placeholder="You are a helpful assistant for..." class="w-full px-4 py-3 rounded-2xl bg-white/70 border border-white/80 focus:outline-none focus:ring-2 focus:ring-orange-500/50 text-gray-800 text-sm shadow-inner"></textarea>
            </div>

            <button onclick="saveConfig()" class="w-full orange-btn text-white font-semibold py-3.5 rounded-2xl transition">
                Save & Deploy Agent
            </button>
        </div>

    </div>

    <script>
        async function loadConfig() {
            const res = await fetch('/api/config');
            const data = await res.json();
            if(data.success) {
                const c = data.config;
                document.getElementById('page_access_token').value = c.page_access_token;
                document.getElementById('comment_access_token').value = c.comment_access_token;
                document.getElementById('groq_api_key').value = c.groq_api_key;
                document.getElementById('custom_prompt').value = c.custom_prompt;
                document.getElementById('toggle_bot').checked = c.is_active;
                document.getElementById('toggle_comment').checked = c.comment_status;

                updateBadge(c.is_active || c.comment_status);
            }
        }

        function updateBadge(isActive) {
            const badge = document.getElementById('connection_badge');
            if(isActive) {
                badge.className = "text-xs font-semibold px-3 py-1 rounded-full bg-emerald-100 text-emerald-800";
                badge.innerText = "● Agent Active";
            } else {
                badge.className = "text-xs font-semibold px-3 py-1 rounded-full bg-rose-100 text-rose-800";
                badge.innerText = "○ Agent Paused";
            }
        }

        async function saveConfig() {
            const payload = {
                page_access_token: document.getElementById('page_access_token').value.trim(),
                comment_access_token: document.getElementById('comment_access_token').value.trim(),
                groq_api_key: document.getElementById('groq_api_key').value.trim(),
                custom_prompt: document.getElementById('custom_prompt').value.trim(),
                is_active: document.getElementById('toggle_bot').checked,
                comment_status: document.getElementById('toggle_comment').checked
            };

            const res = await fetch('/api/config/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if(result.success) {
                alert("Agent configuration saved successfully!");
                loadConfig();
            } else {
                alert("Error: " + result.error);
            }
        }

        async function toggleBot(isActive) {
            await fetch('/api/config/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_active: isActive })
            });
            const isCommentActive = document.getElementById('toggle_comment').checked;
            updateBadge(isActive || isCommentActive);
        }

        async function toggleComment(isCommentActive) {
            await fetch('/api/config/toggle-comment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ comment_status: isCommentActive })
            });
            const isBotActive = document.getElementById('toggle_bot').checked;
            updateBadge(isBotActive || isCommentActive);
        }

        loadConfig();
    </script>
</body>
</html>
